name: Extension CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate manifest and scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate manifest JSON
        run: python -m json.tool manifest.json >/dev/null

      - name: JavaScript syntax checks
        run: |
          node --check background.js
          node --check options.js

  package:
    name: Build extension artifacts
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ZIP artifact
        run: |
          zip -r gitlab-url-migration-redirector.zip \
            manifest.json \
            background.js \
            options.html \
            options.css \
            options.js \
            README.md \
            DEPLOYMENT.md \
            LICENSE

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-url-migration-redirector
          path: gitlab-url-migration-redirector.zip

      - name: Attach ZIP to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gitlab-url-migration-redirector.zip

  publish-guidance:
    name: Optional store publishing placeholder
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Store publishing note
        run: |
          echo "Implement browser store upload here (optional):"
          echo "- Chrome Web Store API using secret: CWS_REFRESH_TOKEN"
          echo "- Edge Partner Center API using tenant/app credentials"
          echo "- Firefox AMO API using JWT credentials"
          echo "Manual submission is still supported if you skip this job."
